<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<title>期中考刷題速遊戲</title>
<style>
:root {
  --bg: #0b1220;
  --card: #152033;
  --card2: #1b2a44;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #14b8a6;
  --accent2: #f59e0b;
  --good: #22c55e;
  --bad: #ef4444;
  --border: #334155;
  --touch: 52px;
  --radius: 16px;
  --shadow: 0 8px 28px rgba(0,0,0,.35);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  min-height: 100%; }
body { padding: 12px 12px calc(16px + var(--safe-b)); max-width: 720px; margin: 0 auto; }
h1 { font-size: 1.35rem; margin: 8px 0 4px; letter-spacing: .02em; }
h2 { font-size: 1.1rem; margin: 0 0 10px; }
.sub { color: var(--muted); font-size: .9rem; margin-bottom: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  min-height: var(--touch); padding: 10px 14px; border-radius: 999px; border: 2px solid var(--border);
  background: var(--card2); color: var(--text); font-size: 1rem; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip.on { border-color: var(--accent); background: rgba(20,184,166,.18); }
.chip .date { color: var(--accent2); font-size: .85rem; }
.btn {
  min-height: var(--touch); padding: 12px 18px; border-radius: 14px; border: none;
  background: var(--accent); color: #042f2e; font-weight: 700; font-size: 1.05rem; cursor: pointer;
  width: 100%;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px dashed var(--border); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.good { background: var(--good); color: #052e16; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
label.field { display: block; font-size: .85rem; color: var(--muted); margin: 8px 0 4px; }
select, input[type=number] {
  width: 100%; min-height: var(--touch); border-radius: 12px; border: 1px solid var(--border);
  background: var(--card2); color: var(--text); font-size: 1rem; padding: 10px 12px;
}
.hud {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px;
}
.hud .stat {
  background: var(--card2); border-radius: 12px; padding: 8px 6px; text-align: center;
  border: 1px solid var(--border);
}
.hud .stat b { display: block; font-size: 1.15rem; color: var(--accent); }
.hud .stat span { font-size: .72rem; color: var(--muted); }
.progress {
  height: 8px; background: #0f172a; border-radius: 999px; overflow: hidden; margin: 8px 0 12px;
}
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .25s ease; }
.qmeta { color: var(--muted); font-size: .82rem; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 2px 8px; }
.qtext { font-size: 1.12rem; line-height: 1.55; margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; }
.opt {
  width: 100%; text-align: left; min-height: 58px; margin: 0 0 10px; padding: 14px 14px;
  border-radius: 14px; border: 2px solid var(--border); background: var(--card2);
  color: var(--text); font-size: 1.02rem; line-height: 1.4; cursor: pointer;
}
.opt:active { transform: scale(.99); }
.opt.correct { border-color: var(--good); background: rgba(34,197,94,.18); }
.opt.wrong { border-color: var(--bad); background: rgba(239,68,68,.16); }
.opt.dim { opacity: .55; }
.opt.picked { border-color: var(--accent); background: rgba(20,184,166,.22); }
.opt .pick-mark { float: right; color: var(--accent); font-weight: 700; }
.feedback { margin-top: 6px; padding: 12px; border-radius: 12px; background: #0f172a; border: 1px solid var(--border); }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--bad); }
.feedback h3 { margin: 0 0 6px; font-size: 1rem; }
.feedback p { margin: 0 0 8px; color: #e2e8f0; line-height: 1.5; white-space: pre-wrap; }
.combo {
  position: fixed; top: 18%; left: 50%; transform: translate(-50%,-50%) scale(.6);
  opacity: 0; pointer-events: none; font-size: 2rem; font-weight: 900; color: var(--accent2);
  text-shadow: 0 0 18px rgba(245,158,11,.7); transition: .15s; z-index: 50;
}
.combo.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
.timer-warn { color: var(--bad) !important; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.screen { display: none; }
.screen.active { display: block; }
.footer-note { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 10px; }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; }
.chapter-list { max-height: 180px; overflow: auto; border: 1px solid var(--border); border-radius: 12px; padding: 8px; background: #0f172a; }
.chapter-list label { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 6px; font-size: .95rem; }
.chapter-list input { width: 20px; height: 20px; }
.result-big { font-size: 2.2rem; font-weight: 800; text-align: center; margin: 8px 0; }
.bar { height: 14px; background: #0f172a; border-radius: 999px; overflow: hidden; margin: 10px 0 16px; }
.bar > i { display:block; height:100%; background: var(--good); }
</style>
</head>
<body>
<div id="combo" class="combo"></div>

<section id="screen-home" class="screen active">
  <h1>💊 期中考刷題速遊戲</h1>
  <p class="sub">離線單檔・大按鈕・適合平板／手機通勤刷題</p>

  <div class="card">
    <h2>選擇科目（可多選）</h2>
    <div id="subject-chips" class="row"></div>
  </div>

  <div class="card">
    <h2>題源篩選</h2>
    <div id="source-chips" class="row">
      <button type="button" class="chip on" data-src="考古">考古</button>
      <button type="button" class="chip on" data-src="國考">國考</button>
      <button type="button" class="chip on" data-src="自編">自編</button>
      <button type="button" class="chip on" data-src="其他">其他</button>
    </div>
    <label class="field">章節（可多選；不選＝全部）</label>
    <div id="chapter-list" class="chapter-list"></div>
  </div>

  <div class="card">
    <h2>模式</h2>
    <label class="field">每題秒數（速刷）</label>
    <input id="sec-per-q" type="number" min="5" max="120" value="25">
    <label class="field">題數上限（0＝全部）</label>
    <input id="q-limit" type="number" min="0" max="999" value="20">
    <div class="grid2" style="margin-top:12px">
      <button class="btn" id="btn-start">🚀 開始速刷</button>
      <button class="btn secondary" id="btn-review">📕 錯題本</button>
    </div>
    <button class="btn ghost" id="btn-clear-wrong" style="margin-top:8px">清空錯題本</button>
    <p class="footer-note" id="pool-info">可出題：0</p>
  </div>
</section>

<section id="screen-quiz" class="screen">
  <div class="hud">
    <div class="stat"><b id="hud-score">0</b><span>分數</span></div>
    <div class="stat"><b id="hud-streak">0</b><span>連對</span></div>
    <div class="stat"><b id="hud-combo">×1</b><span>連擊</span></div>
    <div class="stat"><b id="hud-timer">--</b><span>秒數</span></div>
  </div>
  <div class="progress"><i id="progress-bar"></i></div>
  <div class="card">
    <div class="qmeta" id="q-meta"></div>
    <p class="qtext" id="q-text"></p>
    <div id="options"></div>
    <button class="btn secondary" id="btn-submit-multi" style="display:none;margin-top:4px">送出複選答案</button>
    <div id="feedback" class="feedback" style="display:none"></div>
    <button class="btn" id="btn-next" style="display:none;margin-top:10px">下一題 →</button>
    <button class="btn ghost" id="btn-quit" style="margin-top:8px">結束本輪</button>
  </div>
</section>

<section id="screen-result" class="screen">
  <div class="card">
    <h2>本輪結果</h2>
    <div class="result-big" id="res-score">0</div>
    <div class="bar"><i id="res-bar"></i></div>
    <p id="res-detail" class="sub"></p>
    <div class="grid2">
      <button class="btn" id="btn-again">再來一輪</button>
      <button class="btn secondary" id="btn-home">回主畫面</button>
    </div>
  </div>
</section>

const EXAM_DATES = {"藥物分析":"11/9","藥分":"11/9","生藥學":"11/10","生藥":"11/10","藥劑學(二)":"11/10","藥劑(二)":"11/10","藥科實驗":"11/10","藥學科學實驗":"11/10","藥化":"11/11","藥物化學":"11/11","藥劑實驗":"11/11","藥劑學實驗":"11/11","藥理學":"11/12","藥理":"11/12","臨檢":"11/13","臨床檢驗學":"11/13"};
const LS_WRONG = "cnu_midterm_wrong_v1";

const $ = (id) => document.getElementById(id);
const state = {
  selectedSubjects: new Set(),
  sourceTypes: new Set(["考古","國考","自編","其他"]),
  chapters: new Set(),
  pool: [],
  order: [],
  idx: 0,
  score: 0,
  streak: 0,
  combo: 1,
  correct: 0,
  answered: 0,
  timer: null,
  timeLeft: 0,
  locked: false,
  picked: new Set(),
  mode: "play", // play | review
};

function loadWrong() {
  try { return JSON.parse(localStorage.getItem(LS_WRONG) || "[]"); } catch { return []; }
}
function saveWrong(list) {
  localStorage.setItem(LS_WRONG, JSON.stringify(list.slice(-500)));
}
function qKey(q) { return q.subject + "||" + q.question; }
function addWrong(q) {
  const list = loadWrong().filter(x => qKey(x) !== qKey(q));
  list.push({
    subject: q.subject, source: q.source, source_type: q.source_type, chapter: q.chapter,
    question: q.question, options: q.options, answer: q.answer, explanation: q.explanation,
    corrected: q.corrected, correction_note: q.correction_note,
    multi: !!q.multi, qtype: q.qtype || qTypeOf(q),
    exam_date: q.exam_date || EXAM_DATES[q.subject] || ""
  });
  saveWrong(list);
}
function removeWrong(q) {
  saveWrong(loadWrong().filter(x => qKey(x) !== qKey(q)));
}

function subjectsInBank() {
  const map = new Map();
  for (const q of QUESTIONS) {
    map.set(q.subject, (map.get(q.subject) || 0) + 1);
  }
  return [...map.entries()].sort((a,b) => {
    const da = EXAM_DATES[a[0]] || "99/99";
    const db = EXAM_DATES[b[0]] || "99/99";
    return da.localeCompare(db) || a[0].localeCompare(b[0], "zh-Hant");
  });
}

function renderSubjects() {
  const box = $("subject-chips");
  box.innerHTML = "";
  const subs = subjectsInBank();
  if (!subs.length) {
    box.innerHTML = '<p class="empty">題庫尚無題目，等小幫手交卷後重新產生本檔。</p>';
    return;
  }
  for (const [name, count] of subs) {
    const date = EXAM_DATES[name] || QUESTIONS.find(q => q.subject===name)?.exam_date || "";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip on";
    btn.dataset.subject = name;
    btn.innerHTML = `${name} <span class="date">${date ? "考 "+date : ""}</span> · ${count}`;
    state.selectedSubjects.add(name);
    btn.onclick = () => {
      if (state.selectedSubjects.has(name)) { state.selectedSubjects.delete(name); btn.classList.remove("on"); }
      else { state.selectedSubjects.add(name); btn.classList.add("on"); }
      refreshChapters();
      updatePoolInfo();
    };
    box.appendChild(btn);
  }
}

function refreshChapters() {
  const chapters = new Set();
  for (const q of QUESTIONS) {
    if (state.selectedSubjects.has(q.subject)) chapters.add(q.chapter || "未分章");
  }
  const list = [...chapters].sort((a,b)=>a.localeCompare(b,"zh-Hant"));
  const box = $("chapter-list");
  // keep previous selection intersection
  const prev = new Set(state.chapters);
  state.chapters = new Set([...prev].filter(c => chapters.has(c)));
  box.innerHTML = list.map(c => {
    const checked = state.chapters.size === 0 ? false : state.chapters.has(c);
    return `<label><input type="checkbox" value="${escapeAttr(c)}" ${checked?"checked":""}> ${escapeHtml(c)}</label>`;
  }).join("") || '<p class="empty">先選科目</p>';
  box.querySelectorAll("input").forEach(inp => {
    inp.onchange = () => {
      state.chapters = new Set([...box.querySelectorAll("input:checked")].map(i => i.value));
      updatePoolInfo();
    };
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function filteredPool(base) {
  const srcOk = state.sourceTypes;
  const chapFilter = state.chapters; // empty = all
  return base.filter(q => {
    if (!state.selectedSubjects.has(q.subject)) return false;
    if (!srcOk.has(q.source_type || "其他")) return false;
    if (chapFilter.size && !chapFilter.has(q.chapter || "未分章")) return false;
    return true;
  });
}

function updatePoolInfo() {
  const n = filteredPool(QUESTIONS).length;
  const w = loadWrong().length;
  $("pool-info").textContent = `可出題：${n}　｜　錯題本：${w} 題`;
  $("btn-start").disabled = n === 0;
  $("btn-review").disabled = w === 0;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0,0);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startGame(mode) {
  state.mode = mode;
  let base = mode === "review" ? loadWrong() : QUESTIONS;
  if (mode === "review") {
    // in review, ignore subject filter if empty intersection — use all wrong
    let pool = filteredPool(base);
    if (!pool.length) pool = base.slice();
    state.pool = pool;
  } else {
    state.pool = filteredPool(base);
  }
  if (!state.pool.length) { alert("目前沒有符合條件的題目"); return; }
  let limit = parseInt($("q-limit").value, 10);
  if (!Number.isFinite(limit) || limit < 0) limit = 0;
  state.order = shuffle(state.pool);
  if (limit > 0) state.order = state.order.slice(0, limit);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.combo = 1;
  state.correct = 0;
  state.answered = 0;
  showScreen("screen-quiz");
  renderQuestion();
}

function stopTimer() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
}

function startTimer() {
  stopTimer();
  const sec = parseInt($("sec-per-q").value, 10);
  state.timeLeft = Number.isFinite(sec) && sec > 0 ? sec : 25;
  const el = $("hud-timer");
  el.textContent = state.timeLeft;
  el.classList.remove("timer-warn");
  state.timer = setInterval(() => {
    state.timeLeft -= 1;
    el.textContent = Math.max(0, state.timeLeft);
    if (state.timeLeft <= 5) el.classList.add("timer-warn");
    if (state.timeLeft <= 0) {
      stopTimer();
      if (!state.locked) grade(null); // timeout
    }
  }, 1000);
}

function optionLetter(opt) {
  const m = String(opt).trim().match(/^[\(（]?([A-Ea-eＡ-Ｅ])[\)）．.、:：\s]/);
  if (!m) return null;
  const map = {Ａ:'A',Ｂ:'B',Ｃ:'C',Ｄ:'D',Ｅ:'E',ａ:'A',ｂ:'B',ｃ:'C',ｄ:'D',ｅ:'E'};
  const ch = m[1];
  return (map[ch] || ch).toUpperCase();
}

function qTypeOf(q) {
  if (q.qtype) return q.qtype;
  if (q.multi) return "multi";
  if (!q.options || q.options.length < 2) return "fill";
  return "single";
}

function renderQuestion() {
  stopTimer();
  state.locked = false;
  state.picked = new Set();
  $("feedback").style.display = "none";
  $("btn-next").style.display = "none";
  const submitBtn = $("btn-submit-multi");
  if (submitBtn) submitBtn.style.display = "none";
  const total = state.order.length;
  const q = state.order[state.idx];
  const qtype = qTypeOf(q);
  $("hud-score").textContent = state.score;
  $("hud-streak").textContent = state.streak;
  $("hud-combo").textContent = "×" + state.combo;
  $("progress-bar").style.width = ((state.idx / total) * 100) + "%";
  const date = q.exam_date || EXAM_DATES[q.subject] || "";
  const typeTag = qtype === "multi" ? "複選" : (qtype === "fill" ? "填空／簡答" : "單選");
  $("q-meta").innerHTML = [
    `<span class="tag">${escapeHtml(q.subject)}${date ? " · 考 "+escapeHtml(date) : ""}</span>`,
    `<span class="tag">${escapeHtml(q.source_type || "")}／${escapeHtml(q.source || "")}</span>`,
    `<span class="tag">${escapeHtml(q.chapter || "")}</span>`,
    `<span class="tag">${escapeHtml(typeTag)}</span>`,
    `<span class="tag">${state.idx+1} / ${total}</span>`,
    state.mode === "review" ? `<span class="tag">錯題本</span>` : ""
  ].join("");
  $("q-text").textContent = q.question;
  const box = $("options");
  box.innerHTML = "";

  if (qtype === "fill") {
    const hint = document.createElement("p");
    hint.className = "sub";
    hint.textContent = "這題是填空／簡答：先自己想答案，再點下方按鈕揭曉正解與詳解。";
    box.appendChild(hint);
    const reveal = document.createElement("button");
    reveal.type = "button";
    reveal.className = "btn";
    reveal.textContent = "👁 揭曉答案";
    reveal.onclick = () => gradeFill();
    box.appendChild(reveal);
    const selfRow = document.createElement("div");
    selfRow.className = "grid2";
    selfRow.style.marginTop = "8px";
    const okBtn = document.createElement("button");
    okBtn.type = "button";
    okBtn.className = "btn good";
    okBtn.textContent = "我會了 ✓";
    okBtn.style.display = "none";
    okBtn.id = "fill-ok";
    const noBtn = document.createElement("button");
    noBtn.type = "button";
    noBtn.className = "btn danger";
    noBtn.textContent = "還不會 ✗";
    noBtn.style.display = "none";
    noBtn.id = "fill-no";
    selfRow.appendChild(okBtn);
    selfRow.appendChild(noBtn);
    box.appendChild(selfRow);
    startTimer();
    return;
  }

  (q.options || []).forEach((opt, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.textContent = opt;
    const letter = optionLetter(opt) || "ABCDE"[i];
    b.dataset.letter = letter;
    if (qtype === "multi") {
      b.onclick = () => {
        if (state.locked) return;
        if (state.picked.has(letter)) {
          state.picked.delete(letter);
          b.classList.remove("picked");
        } else {
          state.picked.add(letter);
          b.classList.add("picked");
        }
      };
    } else {
      b.onclick = () => gradeSingle(letter, b);
    }
    box.appendChild(b);
  });

  if (qtype === "multi" && submitBtn) {
    submitBtn.style.display = "block";
    submitBtn.onclick = () => {
      if (state.locked) return;
      if (!state.picked.size) { alert("請至少選一個選項"); return; }
      const chosen = [...state.picked].sort().join("");
      gradeChoice(chosen);
    };
  }
  startTimer();
}

function flashCombo(text) {
  const el = $("combo");
  el.textContent = text;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 650);
}

function showFeedback(ok, title, q) {
  const fb = $("feedback");
  fb.style.display = "block";
  fb.className = "feedback " + (ok ? "ok" : "no");
  let html = `<h3>${title}</h3>`;
  html += `<p><b>正解：</b>${escapeHtml(q.answer)}</p>`;
  if (q.explanation) html += `<p><b>詳解：</b>${escapeHtml(q.explanation)}</p>`;
  if (q.corrected || (q.correction_note && String(q.correction_note).trim())) {
    html += `<p><b>訂正備註：</b>${escapeHtml(q.correction_note || "（已標示可能需訂正）")}</p>`;
  }
  fb.innerHTML = html;
}

function applyScore(ok, q) {
  state.answered += 1;
  if (ok) {
    state.correct += 1;
    state.streak += 1;
    if (state.streak >= 3) state.combo = Math.min(5, 1 + Math.floor(state.streak / 3));
    const gained = 100 * state.combo + Math.max(0, state.timeLeft) * 2;
    state.score += gained;
    if (state.streak >= 3) flashCombo(`COMBO ×${state.combo}`);
    else if (state.streak === 2) flashCombo("連對！");
    removeWrong(q);
  } else {
    state.streak = 0;
    state.combo = 1;
    addWrong(q);
  }
  $("hud-score").textContent = state.score;
  $("hud-streak").textContent = state.streak;
  $("hud-combo").textContent = "×" + state.combo;
  $("btn-next").style.display = "block";
  $("btn-next").textContent = state.idx + 1 >= state.order.length ? "看結果" : "下一題 →";
  const submitBtn = $("btn-submit-multi");
  if (submitBtn) submitBtn.style.display = "none";
}

function markOptionButtons(q, chosen) {
  const ansSet = new Set(String(q.answer).toUpperCase().split(""));
  const chosenSet = new Set(String(chosen || "").toUpperCase().split(""));
  const buttons = [...$("options").querySelectorAll("button.opt")];
  buttons.forEach((b, i) => {
    const letter = b.dataset.letter || optionLetter(b.textContent) || "ABCDE"[i];
    b.disabled = true;
    if (ansSet.has(letter)) b.classList.add("correct");
    else if (chosenSet.has(letter)) b.classList.add("wrong");
    else b.classList.add("dim");
  });
}

function gradeSingle(letter, btn) {
  gradeChoice(letter);
}

function gradeChoice(chosen) {
  if (state.locked) return;
  state.locked = true;
  stopTimer();
  const q = state.order[state.idx];
  const norm = (s) => String(s || "").toUpperCase().replace(/[^A-E]/g, "").split("").sort().join("");
  const ok = !!chosen && norm(chosen) === norm(q.answer);
  markOptionButtons(q, chosen || "");
  let title = ok ? "✅ 答對了！" : (chosen ? "❌ 答錯了" : "⏰ 時間到");
  showFeedback(ok, title, q);
  applyScore(ok, q);
}

function gradeFill() {
  if (state.locked) return;
  // reveal first; user self-grades
  stopTimer();
  const q = state.order[state.idx];
  showFeedback(true, "📖 參考答案", q);
  const okBtn = $("fill-ok");
  const noBtn = $("fill-no");
  if (okBtn && noBtn) {
    okBtn.style.display = "block";
    noBtn.style.display = "block";
    okBtn.onclick = () => {
      if (state.locked) return;
      state.locked = true;
      applyScore(true, q);
      okBtn.disabled = true; noBtn.disabled = true;
    };
    noBtn.onclick = () => {
      if (state.locked) return;
      state.locked = true;
      applyScore(false, q);
      okBtn.disabled = true; noBtn.disabled = true;
    };
  }
}

function grade(chosen) {
  // timeout / generic
  const q = state.order[state.idx];
  const qtype = qTypeOf(q);
  if (qtype === "fill") {
    gradeFill();
    return;
  }
  if (qtype === "multi") {
    const chosenStr = [...(state.picked || [])].sort().join("");
    gradeChoice(chosenStr || null);
    return;
  }
  gradeChoice(chosen || null);
}

function nextQ() {
  if (state.idx + 1 >= state.order.length) {
    finish();
    return;
  }
  state.idx += 1;
  renderQuestion();
}

function finish() {
  stopTimer();
  showScreen("screen-result");
  const acc = state.answered ? Math.round(state.correct / state.answered * 100) : 0;
  $("res-score").textContent = state.score + " 分";
  $("res-bar").style.width = acc + "%";
  $("res-detail").textContent = `答對 ${state.correct} / ${state.answered}（正確率 ${acc}%）・最高連擊 ×${Math.max(1, state.combo)}・錯題已自動存進錯題本`;
  updatePoolInfo();
}

// wire UI
document.querySelectorAll("#source-chips .chip").forEach(chip => {
  chip.onclick = () => {
    const t = chip.dataset.src;
    if (state.sourceTypes.has(t)) { state.sourceTypes.delete(t); chip.classList.remove("on"); }
    else { state.sourceTypes.add(t); chip.classList.add("on"); }
    updatePoolInfo();
  };
});
$("btn-start").onclick = () => startGame("play");
$("btn-review").onclick = () => startGame("review");
$("btn-next").onclick = nextQ;
$("btn-quit").onclick = finish;
$("btn-again").onclick = () => startGame(state.mode);
$("btn-home").onclick = () => { stopTimer(); showScreen("screen-home"); updatePoolInfo(); };
$("btn-clear-wrong").onclick = () => {
  if (confirm("確定清空錯題本？")) { saveWrong([]); updatePoolInfo(); }
};
["sec-per-q","q-limit"].forEach(id => $(id).addEventListener("change", updatePoolInfo));

renderSubjects();
refreshChapters();
updatePoolInfo();
</script>
</body>
</html>
